name: Windows build and test

# push と pull request のたびに、Windows でビルドして、main で動かすテストを実行する。
# 結果は GitHub の Actions のページに残る（Linux 側のエージェントは `gh run list` で見られる）。
# 画面の操作が要る確認（ダイアログなど）は、ここでは行わない。HANDOFF.md の「Windows で未確認」に書く。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build (mvn package)
        shell: bash
        run: mvn -B -q package

      - name: Compile tests
        shell: bash
        run: mvn -B -q test-compile

      # src/test のテストは JUnit を使わず main で動かす。1つでも失敗すると終了コード 1 で終わる。
      # テストが増えても書き足さなくてよいように、*Test.class を全部動かす（1つ失敗しても残りは動かし、最後にまとめて失敗にする）
      - name: Run tests
        shell: bash
        run: |
          failed=0
          for f in target/test-classes/com/example/minieditor/*Test.class; do
            name=$(basename "$f" .class)
            echo "=== $name"
            java -cp "target/classes;target/test-classes" "com.example.minieditor.$name" || { echo "FAILED: $name"; failed=1; }
          done
          exit $failed

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: minieditor-jar
          path: target/minieditor.jar
          retention-days: 7
